<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Sơ đồ minh họa: Hồ sơ lấy ý kiến 1/500 Olympic A, B, C, D: cách đọc</title><desc id="desc">Ba nội dung: Bắt đầu từ tên thông báo và đối tượng lấy ý kiến; Đọc bản vẽ cùng chú giải và bảng chỉ tiêu; Chuẩn bị ý kiến theo vấn đề cụ thể. Đồ họa biên tập, không phải bản vẽ dự án.</desc><rect width="1000" height="650" fill="#f4f0e8"/><path d="M0 0H1000V210H0Z" fill="#102c40"/><rect x="56" y="43" width="63" height="5" rx="2" fill="#d8b371"/><text x="140" y="53" font-family="sans-serif" font-size="18" letter-spacing="3" fill="#dfc38c">CẨM NANG NHÀ Ở</text><g font-family="Arial, sans-serif"><text x="56" y="109" fill="#fff" font-size="33" font-weight="600">Hồ sơ lấy ý kiến 1/500 Olympic A, B, C, D:</text><text x="56" y="155" fill="#fff" font-size="33" font-weight="600">cách đọc</text><text x="56" y="247" fill="#6b7c88" font-size="19">Các điểm đối chiếu trong bài</text><rect x="56" y="276" width="280" height="270" rx="18" fill="#fff" stroke="#d2dce3"/><circle cx="98" cy="318" r="23" fill="#17354a"/><text x="98" y="326" text-anchor="middle" fill="#fff" font-size="21">01</text><text x="80" y="386" fill="#17354a" font-size="23">Bắt đầu từ tên</text><text x="80" y="417" fill="#17354a" font-size="23">thông báo và đối</text><text x="80" y="448" fill="#17354a" font-size="23">tượng lấy ý kiến</text><rect x="360" y="276" width="280" height="270" rx="18" fill="#fff" stroke="#d2dce3"/><circle cx="402" cy="318" r="23" fill="#17354a"/><text x="402" y="326" text-anchor="middle" fill="#fff" font-size="21">02</text><text x="384" y="386" fill="#17354a" font-size="23">Đọc bản vẽ cùng chú</text><text x="384" y="417" fill="#17354a" font-size="23">giải và bảng chỉ</text><text x="384" y="448" fill="#17354a" font-size="23">tiêu</text><rect x="664" y="276" width="280" height="270" rx="18" fill="#fff" stroke="#d2dce3"/><circle cx="706" cy="318" r="23" fill="#17354a"/><text x="706" y="326" text-anchor="middle" fill="#fff" font-size="21">03</text><text x="688" y="386" fill="#17354a" font-size="23">Chuẩn bị ý kiến</text><text x="688" y="417" fill="#17354a" font-size="23">theo vấn đề cụ thể</text><path d="M56 580H944" stroke="#cdbd9d"/><text x="56" y="615" fill="#596d7c" font-size="17">Hình minh họa biên tập • Không phải bản vẽ hoặc thông báo của dự án</text></g></svg>