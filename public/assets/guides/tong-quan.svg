<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>Sơ đồ biên tập: Vinhomes Olympic Thường Tín: Tổng quan dự án</title><rect width="1000" height="650" fill="#f4f0e8"/><rect width="1000" height="210" fill="#102c40"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#fff" font-size="32">Vinhomes Olympic Thường Tín: Tổng quan dự</text><text x="40" y="106" fill="#fff" font-size="32">án</text><rect x="40" y="240" width="920" height="95" rx="10" fill="#fff"/><text x="60" y="275" font-size="20" fill="#956c2e">01</text><text x="110" y="275" fill="#17354a" font-size="24">Vinhomes Olympic Thường Tín là dự án nào?</text><rect x="40" y="352" width="920" height="95" rx="10" fill="#fff"/><text x="60" y="387" font-size="20" fill="#956c2e">02</text><text x="110" y="387" fill="#17354a" font-size="24">Quy mô 9.171 ha và 2.944,39 ha khác nhau thế nào?</text><rect x="40" y="464" width="920" height="95" rx="10" fill="#fff"/><text x="60" y="499" font-size="20" fill="#956c2e">03</text><text x="110" y="499" fill="#17354a" font-size="24">Ai được nêu trong hồ sơ dự án thành phần B?</text><text x="40" y="625" fill="#556873" font-size="17">Sơ đồ biên tập • Không phải bản vẽ dự án hoặc ảnh hiện trường</text></g></svg>