<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Sơ đồ minh họa: Giá bán, chiết khấu và quỹ căn Olympic | Mạnh Việt</title><desc id="desc">Ba nội dung: Vì sao trang chưa đăng giá cụ thể?; Khi có bảng giá, cần xem những gì?; Chính sách tài chính có thể thay đổi. Đồ họa biên tập, không phải bản vẽ dự án.</desc><rect width="1000" height="650" fill="#f4f0e8"/><path d="M0 0H1000V210H0Z" fill="#102c40"/><rect x="56" y="43" width="63" height="5" rx="2" fill="#d8b371"/><text x="140" y="53" font-family="sans-serif" font-size="18" letter-spacing="3" fill="#dfc38c">CẨM NANG NHÀ Ở</text><g font-family="Arial, sans-serif"><text x="56" y="109" fill="#fff" font-size="33" font-weight="600">Giá bán, chiết khấu và quỹ căn Olympic |</text><text x="56" y="155" fill="#fff" font-size="33" font-weight="600">Mạnh Việt</text><text x="56" y="247" fill="#6b7c88" font-size="19">Các điểm đối chiếu trong bài</text><rect x="56" y="276" width="280" height="270" rx="18" fill="#fff" stroke="#d2dce3"/><circle cx="98" cy="318" r="23" fill="#17354a"/><text x="98" y="326" text-anchor="middle" fill="#fff" font-size="21">01</text><text x="80" y="386" fill="#17354a" font-size="23">Vì sao trang chưa</text><text x="80" y="417" fill="#17354a" font-size="23">đăng giá cụ thể?</text><rect x="360" y="276" width="280" height="270" rx="18" fill="#fff" stroke="#d2dce3"/><circle cx="402" cy="318" r="23" fill="#17354a"/><text x="402" y="326" text-anchor="middle" fill="#fff" font-size="21">02</text><text x="384" y="386" fill="#17354a" font-size="23">Khi có bảng giá,</text><text x="384" y="417" fill="#17354a" font-size="23">cần xem những gì?</text><rect x="664" y="276" width="280" height="270" rx="18" fill="#fff" stroke="#d2dce3"/><circle cx="706" cy="318" r="23" fill="#17354a"/><text x="706" y="326" text-anchor="middle" fill="#fff" font-size="21">03</text><text x="688" y="386" fill="#17354a" font-size="23">Chính sách tài</text><text x="688" y="417" fill="#17354a" font-size="23">chính có thể thay</text><text x="688" y="448" fill="#17354a" font-size="23">đổi</text><path d="M56 580H944" stroke="#cdbd9d"/><text x="56" y="615" fill="#596d7c" font-size="17">Hình minh họa biên tập • Không phải bản vẽ hoặc thông báo của dự án</text></g></svg>